<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Codeforces Downloader</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #333;
    }
    .section {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      margin-top: 5px;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .secondary-btn {
      background-color: #2196F3;
    }
    .secondary-btn:hover {
      background-color: #0b7dda;
    }
    .status {
      padding: 8px;
      margin-top: 10px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .status.success {
      background-color: #d4edda;
      color: #155724;
      display: block;
    }
    .status.error {
      background-color: #f8d7da;
      color: #721c24;
      display: block;
    }
    .privacy-note {
      font-size: 11px;
      color: #666;
      margin-top: 10px;
      padding: 8px;
      background-color: #f0f0f0;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h2>🏆 Codeforces Downloader</h2>

  <div class="section">
    <label for="contestId">Contest ID:</label>
    <input type="number" id="contestId" placeholder="e.g., 2000">
  </div>

  <div class="section">
    <label for="problemIndex">Problem Index:</label>
    <input type="text" id="problemIndex" placeholder="e.g., A, B, C" style="text-transform: uppercase;">
  </div>

  <button id="downloadBtn">📥 Download Problem</button>
  <button id="settingsBtn" class="secondary-btn">⚙️ Settings</button>

  <div id="status" class="status"></div>

  <div class="privacy-note">
    🔒 <strong>Privacy First:</strong> All data stays local. Your API credentials are never sent anywhere except Codeforces.
  </div>

  <script src="popup.js"></script>
</body>
</html>
